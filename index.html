<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

/* ---------- тема ---------- */
function primenitTemu(){
  if (!tg) return;
  if (tg.colorScheme === "dark") document.documentElement.setAttribute("data-theme","dark");
  else if (tg.colorScheme === "light") document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");
}
if (tg){
  primenitTemu();
  try { tg.onEvent && tg.onEvent("themeChanged", primenitTemu); } catch(e){}
}
function temnayaTema(){
  const atr = document.documentElement.getAttribute("data-theme");
  if (atr === "dark") return true;
  if (atr === "light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}

/* ---------- курсы (как было) ---------- */
const KURSY = [
  {id:"peregovory", nazvanie:"Переговоры с заказчиком", opis:"Реальные кейсы. Отвечаешь, получаешь разбор в чат.", fayl:null},
  {id:"prodazhi", nazvanie:"Продажи и цена", opis:"Как называть цену, держать объем, поднимать чек.", fayl:"kurs_prodazhi.json"},
  {id:"english", nazvanie:"Английский для заказчиков", opis:"Переписка, правки, сроки, деньги.", fayl:"kurs_english.json"},
  {id:"tehminimum", nazvanie:"Техминимум", opis:"Что вообще происходит в твоих проектах.", fayl:"kurs_tehminimum.json"}
];

const dannye = {};
let progress = {};

/* ---------- хранилище: правила старого кода не трогаем ---------- */
function hranilishe(){
  if (!tg || !tg.CloudStorage || !tg.isVersionAtLeast || !tg.isVersionAtLeast("6.9")) return null;
  return tg.CloudStorage;
}

function chitayuProgress(gotovo){
  const h = hranilishe();
  let uzhe = false;
  const odinRaz = () => { if (!uzhe) { uzhe = true; gotovo(); } };
  if (!h) { mestniy(); odinRaz(); return; }
  setTimeout(() => { if (!uzhe) { mestniy(); odinRaz(); } }, 2500);
  try {
    h.getItem("progress", (osh, znach) => {
      if (!osh && znach) { try { progress = JSON.parse(znach); } catch(e){} }
      if (!Object.keys(progress).length) mestniy();
      odinRaz();
    });
  } catch(e) { mestniy(); odinRaz(); }
}
function mestniy(){
  try { progress = JSON.parse(localStorage.getItem("progress") || "{}"); } catch(e){ progress = {}; }
}
function pishuProgress(){
  const stroka = JSON.stringify(progress);
  try { localStorage.setItem("progress", stroka); } catch(e){}
  const h = hranilishe();
  if (h) { try { h.setItem("progress", stroka, () => {}); } catch(e){} }
}

/* ---------- обобщенное хранилище: клетки, план дня, карточки ---------- */
function citatKlyuchi(klyuchi, gotovo){
  const h = hranilishe();
  let uzhe = false;
  const rezultat = {};
  const odinRaz = () => { if (!uzhe) { uzhe = true; gotovo(rezultat); } };
  const izLokalnogo = () => {
    klyuchi.forEach(k => { try { const v = localStorage.getItem(k); if (v != null) rezultat[k] = v; } catch(e){} });
  };
  if (!h || !h.getItems) { izLokalnogo(); odinRaz(); return; }
  setTimeout(() => { if (!uzhe) { izLokalnogo(); odinRaz(); } }, 2500);
  try {
    h.getItems(klyuchi, (osh, znach) => {
      if (!osh && znach) Object.assign(rezultat, znach);
      if (!Object.keys(rezultat).length) izLokalnogo();
      odinRaz();
    });
  } catch(e) { izLokalnogo(); odinRaz(); }
}
function citatKlyuchiP(klyuchi){ return new Promise(res => citatKlyuchi(klyuchi, res)); }

function pishuKlyuch(klyuch, znachenie){
  try { localStorage.setItem(klyuch, znachenie); } catch(e){}
  const h = hranilishe();
  if (h) { try { h.setItem(klyuch, znachenie, () => {}); } catch(e){} }
}

function poluchitVseKlyuchi(gotovo){
  const h = hranilishe();
  if (h && h.getKeys) {
    try { h.getKeys((osh, spisok) => { gotovo(osh ? [] : (spisok || [])); }); return; } catch(e){}
  }
  try { gotovo(Object.keys(localStorage)); } catch(e){ gotovo([]); }
}
function poluchitVseKlyuchiP(){ return new Promise(res => poluchitVseKlyuchi(res)); }

async function gruzhu(fayl){
  if (!fayl) return [];
  if (dannye[fayl]) return dannye[fayl];
  try {
    const otvet = await fetch(fayl + "?v=" + Date.now());
    if (!otvet.ok) return [];
    dannye[fayl] = await otvet.json();
    return dannye[fayl];
  } catch(e){ return []; }
}

function tryaska(){
  try { if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1")) tg.HapticFeedback.impactOccurred("light"); } catch(e){}
}

/* ---------- даты ---------- */
const NEDELYA = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const NEDELYA_KOR = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const MESYACY = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function slovamiData(d){ return NEDELYA[d.getDay()] + ", " + d.getDate() + " " + MESYACY[d.getMonth()]; }
function klMonthKey(d){ return "kl_" + d.getFullYear() + "_" + pad2(d.getMonth()+1); }
function dnMonthKey(d){ return "dn_" + d.getFullYear() + "_" + pad2(d.getMonth()+1); }
function denNomer(d){ return String(d.getDate()); }
function denEpohi(d){ return Math.floor(d.getTime() / 86400000); }
function denEpohiSeychas(){ return denEpohi(new Date()); }
function novayaData(smeshhenieDney){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + (smeshhenieDney || 0));
  return d;
}

/* ---------- привычки: клетки ---------- */
const PALITRA = [
  {colorL:"#2E5266", colorD:"#6FA8C4"},
  {colorL:"#4C7A6D", colorD:"#77B49F"},
  {colorL:"#7C5F94", colorD:"#A78CC0"},
  {colorL:"#B4703A", colorD:"#D69A5E"}
];
const PRIVYCHKI_PO_UMOLCHANIYU = [
  {id:"pull", name:"Подтягивания", unit:"подход", colorL:"#2E5266", colorD:"#6FA8C4"},
  {id:"push", name:"Отжимания", unit:"подход", colorL:"#4C7A6D", colorD:"#77B49F"},
  {id:"skin", name:"Кожа", unit:"ритуал", colorL:"#7C5F94", colorD:"#A78CC0"},
  {id:"learn", name:"Учеба", unit:"20 минут", colorL:"#B4703A", colorD:"#D69A5E"}
];
const NORMA_KLETOK = 5;
const CENA_LISTA = 5 * 365 / 2500;
const LIST_RYADOV = 60, LIST_STOLBCOV = 42;

function cvetPrivychki(p){ return temnayaTema() ? p.colorD : p.colorL; }

let privychkiCache = null;
async function poluchitPrivychki(){
  if (privychkiCache) return privychkiCache;
  const rez = await citatKlyuchiP(["kl_cfg"]);
  if (rez.kl_cfg) { try { privychkiCache = JSON.parse(rez.kl_cfg); } catch(e){ privychkiCache = null; } }
  if (!privychkiCache) privychkiCache = PRIVYCHKI_PO_UMOLCHANIYU.slice();
  return privychkiCache;
}
function sohranitPrivychki(spisok){
  privychkiCache = spisok;
  pishuKlyuch("kl_cfg", JSON.stringify(spisok));
}

const klMesyacy = {};
async function poluchitMesyacKletok(mk){
  if (klMesyacy[mk]) return klMesyacy[mk];
  const rez = await citatKlyuchiP([mk]);
  let dan = {};
  if (rez[mk]) { try { dan = JSON.parse(rez[mk]); } catch(e){ dan = {}; } }
  klMesyacy[mk] = dan;
  return dan;
}
function summaDnya(dan, den){
  const zap = dan[den] || {};
  return Object.values(zap).reduce((a,b) => a + b, 0);
}

let klTaymer = null, klTaymerMk = null;
function otlozhitZapisKletok(mk){
  klTaymerMk = mk;
  clearTimeout(klTaymer);
  klTaymer = setTimeout(() => { pishuKlyuch(klTaymerMk, JSON.stringify(klMesyacy[klTaymerMk])); }, 600);
}
async function izmenitKletku(privychkaId, delta){
  const seg = novayaData(0);
  const mk = klMonthKey(seg);
  const dan = await poluchitMesyacKletok(mk);
  const den = denNomer(seg);
  if (!dan[den]) dan[den] = {};
  const bylo = dan[den][privychkaId] || 0;
  const novoe = Math.max(0, bylo + delta);
  if (novoe === 0) delete dan[den][privychkaId]; else dan[den][privychkaId] = novoe;
  otlozhitZapisKletok(mk);
  if (delta > 0) tryaska();
  return novoe;
}

async function summaZaDney(dney){
  let itog = 0;
  const seg = novayaData(0);
  for (let i = 0; i < dney; i++){
    const d = novayaData(-i);
    const dan = await poluchitMesyacKletok(klMonthKey(d));
    itog += summaDnya(dan, denNomer(d));
  }
  return itog;
}

async function vsegoZahodov(){
  const vseKlyuchi = await poluchitVseKlyuchiP();
  const mesKlyuchi = vseKlyuchi.filter(k => /^kl_\d{4}_\d{2}$/.test(k));
  if (!mesKlyuchi.length) return 0;
  const rez = await citatKlyuchiP(mesKlyuchi);
  let itog = 0;
  for (const k of mesKlyuchi){
    if (!rez[k]) continue;
    try {
      const dan = JSON.parse(rez[k]);
      klMesyacy[k] = klMesyacy[k] || dan;
      Object.values(dan).forEach(den => { itog += Object.values(den).reduce((a,b) => a+b, 0); });
    } catch(e){}
  }
  return itog;
}

async function serii(){
  let s1 = 0, s5 = 0, s5slomana = false;
  for (let i = 0; i < 3650; i++){
    const d = novayaData(-i);
    const dan = await poluchitMesyacKletok(klMonthKey(d));
    const summa = summaDnya(dan, denNomer(d));
    if (summa === 0) break;
    s1++;
    if (!s5slomana){ if (summa >= NORMA_KLETOK) s5++; else s5slomana = true; }
  }
  return {s1, s5};
}

/* ---------- карточки английского (Лейтнер) ---------- */
const LEITNER_DNI = [0,1,3,7,14];
let fcKolodaCache = null;
async function fcKoloda(){
  if (fcKolodaCache) return fcKolodaCache;
  const uroki = await gruzhu("kurs_english.json");
  const karty = [];
  uroki.forEach(u => (u.frazy || []).forEach(f => karty.push({en:f.en || "", ru:f.ru || ""})));
  fcKolodaCache = karty;
  return karty;
}
let fcSost = null;
async function fcZagrusit(){
  if (fcSost) return fcSost;
  const rez = await citatKlyuchiP(["fc"]);
  try { fcSost = rez.fc ? JSON.parse(rez.fc) : {}; } catch(e){ fcSost = {}; }
  return fcSost;
}
let fcTaymer = null;
function fcSohranitOtlozheno(){
  clearTimeout(fcTaymer);
  fcTaymer = setTimeout(() => { pishuKlyuch("fc", JSON.stringify(fcSost)); }, 600);
}
async function fcOcheredKart(limit){
  const koloda = await fcKoloda();
  await fcZagrusit();
  const seg = denEpohiSeychas();
  const spisok = koloda.map((k,i) => {
    const zap = fcSost[i];
    const box = zap != null ? Math.floor(zap / 100000) : 0;
    const due = zap != null ? zap % 100000 : seg;
    return {i, en:k.en, ru:k.ru, box, due};
  });
  const gotovyye = spisok.filter(k => k.due <= seg).sort((a,b) => a.box - b.box);
  if (gotovyye.length >= limit) return gotovyye.slice(0, limit);
  const ostalnye = spisok.filter(k => k.due > seg);
  return gotovyye.concat(ostalnye.slice(0, limit - gotovyye.length));
}
function fcOtvetit(karta, znayu){
  const seg = denEpohiSeychas();
  const box = znayu ? Math.min(karta.box + 1, 4) : 0;
  const due = seg + LEITNER_DNI[box];
  fcSost[karta.i] = box * 100000 + due;
  fcSohranitOtlozheno();
}
async function fcSkolkoKSegodnya(){
  const koloda = await fcKoloda();
  if (!koloda.length) return null;
  await fcZagrusit();
  const seg = denEpohiSeychas();
  let n = 0;
  koloda.forEach((k, i) => {
    const due = fcSost[i] != null ? fcSost[i] % 100000 : seg;
    if (due <= seg) n++;
  });
  return n;
}

/* ---------- напоминания ---------- */
function baytyStroki(s){
  try { return new TextEncoder().encode(s).length; } catch(e){ return s.length; }
}
async function napGruzim(){
  const rez = await citatKlyuchiP(["nap"]);
  let spisok = [];
  if (rez.nap) { try { spisok = JSON.parse(rez.nap); } catch(e){ spisok = []; } }
  return Array.isArray(spisok) ? spisok : [];
}
function napFormatVremya(kogdaSek){
  const d = new Date(kogdaSek * 1000);
  const seg = novayaData(0), zavtra = novayaData(1);
  const chch = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  const toZheDen = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if (toZheDen(d, seg)) return "сегодня " + chch;
  if (toZheDen(d, zavtra)) return "завтра " + chch;
  return pad2(d.getDate()) + "." + pad2(d.getMonth()+1) + " " + chch;
}
async function napSkoroBudushhaya(){
  const spisok = await napGruzim();
  const seg = Math.floor(Date.now()/1000);
  const budushhie = spisok.filter(z => z && z.k > seg).sort((a,b) => a.k - b.k);
  return budushhie.length ? budushhie[0] : null;
}
async function napDobavit(tekst, kogda){
  let spisok = await napGruzim();
  const seg = Math.floor(Date.now()/1000);
  spisok = spisok.filter(z => z && typeof z.k === "number" && z.k > seg - 86400);
  spisok.push({t: tekst, k: kogda});
  spisok.sort((a,b) => a.k - b.k);
  if (spisok.length > 20) spisok = spisok.slice(spisok.length - 20);
  let stroka = JSON.stringify(spisok);
  while (baytyStroki(stroka) > 4000 && spisok.length > 1){
    spisok.shift();
    stroka = JSON.stringify(spisok);
  }
  pishuKlyuch("nap", stroka);
  return spisok;
}

function svgKoltso(znachenie, norma){
  const r = 34, l = 2 * Math.PI * r, dolya = Math.min(1, znachenie / norma);
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width","84"); svg.setAttribute("height","84"); svg.setAttribute("viewBox","0 0 84 84");
  const fon = document.createElementNS(svg.namespaceURI,"circle");
  fon.setAttribute("cx","42"); fon.setAttribute("cy","42"); fon.setAttribute("r",r);
  fon.setAttribute("fill","none"); fon.setAttribute("stroke","var(--setka)"); fon.setAttribute("stroke-width","8");
  const perednyy = document.createElementNS(svg.namespaceURI,"circle");
  perednyy.setAttribute("cx","42"); perednyy.setAttribute("cy","42"); perednyy.setAttribute("r",r);
  perednyy.setAttribute("fill","none"); perednyy.setAttribute("stroke","var(--chernila)"); perednyy.setAttribute("stroke-width","8");
  perednyy.setAttribute("stroke-linecap","round");
  perednyy.setAttribute("stroke-dasharray", (l*dolya) + " " + l);
  perednyy.setAttribute("transform","rotate(-90 42 42)");
  svg.append(fon, perednyy);
  return svg;
}

function narisovatList(canvas, vsegoZahodovChislo){
  const ctx = canvas.getContext("2d");
  const w = canvas.width / LIST_STOLBCOV, h = canvas.height / LIST_RYADOV;
  const zakrasheno = Math.floor(vsegoZahodovChislo / CENA_LISTA);
  const chernila = getComputedStyle(document.documentElement).getPropertyValue("--chernila").trim() || "#213A5C";
  const setka = getComputedStyle(document.documentElement).getPropertyValue("--setka").trim() || "#DCE3E8";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let n = 0;
  for (let r = 0; r < LIST_RYADOV; r++){
    for (let c = 0; c < LIST_STOLBCOV; c++){
      ctx.fillStyle = n < zakrasheno ? chernila : "transparent";
      ctx.strokeStyle = setka;
      ctx.lineWidth = 1;
      ctx.fillRect(c*w, r*h, w, h);
      ctx.strokeRect(c*w, r*h, w, h);
      n++;
    }
  }
}

function zakrytUrok(kurs, urok, verno, vsego){
  if (!progress[kurs.id]) progress[kurs.id] = [];
  if (!progress[kurs.id].includes(urok.id)) progress[kurs.id].push(urok.id);
  pishuProgress();
  const e = ekran();
  const itog = el("div","blok");
  itog.append(el("div","metka","Урок пройден"));
  itog.append(el("div","", vsego ? ("Верных " + verno + " из " + vsego) : "Отмечен как пройденный"));
  const k = el("button","knopka","К списку уроков");
  k.style.marginTop = "12px";
  k.onclick = () => { stekEkranov.pop(); otkrytEkran(() => spisokUrokov(kurs)); };
  itog.append(k);
  e.append(itog);
  itog.scrollIntoView({behavior:"smooth", block:"end"});
}

async function spisokKejsov(){
  const kejsy = await gruzhu("scenarii.json");
  ochistit();
  const e = ekran();
  e.append(el("div","zag-vk","Переговоры с заказчиком"));
  if (!kejsy.length){ e.append(el("p","pusto","Кейсы не загрузились.")); return; }
  e.append(el("p","podpis","Реальные сообщения заказчиков. Пишешь ответ, разбор приходит в чат."));
  const setka = el("div","");
  kejsy.forEach((kejs, nomer) => {
    const proydeno = (progress.peregovory || []).includes(String(nomer));
    const karta = el("button","karta-kurs");
    const ryad = el("div","ryad");
    const levo = el("div");
    levo.append(el("h2","", (nomer+1) + ". " + (kejs.kto || "Заказчик")));
    const kusok = (kejs.soobshenie || "").slice(0,90);
    levo.append(el("div","opis", kusok + ((kejs.soobshenie||"").length > 90 ? "..." : "")));
    ryad.append(levo);
    const znakKejs = el("div","znak");
    if (proydeno) znakKejs.append(svgGalochka(18));
    ryad.append(znakKejs);
    karta.append(ryad);
    karta.onclick = () => { tryaska(); otkrytEkran(() => kejsEkran(kejs, nomer)); };
    setka.append(karta);
  });
  e.append(setka);
}

function kejsEkran(kejs, nomer){
  ochistit();
  const e = ekran();
  e.append(el("div","zag-vk", kejs.kto || "Заказчик"));
  if (kejs.chego_hotel) e.append(el("p","podpis", "Чего он добивается: " + kejs.chego_hotel));

  const blok = el("div","blok");
  blok.append(el("div","metka","Сообщение заказчика"));
  blok.append(el("div","kejs", kejs.soobshenie || ""));
  e.append(blok);

  const otvetBlok = el("div","blok");
  otvetBlok.append(el("div","metka","Твой ответ"));
  const pole = document.createElement("textarea");
  pole.id = "otvet_" + nomer;
  pole.placeholder = "Напиши так, как отправил бы заказчику.";
  otvetBlok.append(pole);
  const schetchik = el("div","schetchik","0 знаков");
  otvetBlok.append(schetchik);
  pole.oninput = () => {
    schetchik.textContent = pole.value.length + " знаков" + (pole.value.length > 400 ? ", длинновато" : "");
    knopka.disabled = pole.value.trim().length < 10;
  };
  const knopka = el("button","knopka","Отправить на разбор");
  knopka.disabled = true;
  knopka.style.marginTop = "12px";
  knopka.onclick = () => {
    if (!progress.peregovory) progress.peregovory = [];
    if (!progress.peregovory.includes(String(nomer))) progress.peregovory.push(String(nomer));
    pishuProgress();
    const gruz = JSON.stringify({
      tip: "razbor",
      kejs: kejs.soobshenie || "",
      situaciya: kejs.chego_hotel || "",
      otvet: pole.value.trim()
    });
    if (tg && tg.sendData) tg.sendData(gruz);
    else alert("Разбор работает внутри телеграма.");
  };
  otvetBlok.append(knopka);
  const podskazka = el("div","pochemu","Разбор придет сообщением в чат: что отдал, что удержал, как надо было.");
  otvetBlok.append(podskazka);
  e.append(otvetBlok);
}

/* ---------- сессия карточек английского ---------- */
async function fcSessiyaEkran(){
  ochistit();
  const e = ekran();
  e.append(el("div","zag-vk","Карточки английского"));
  const ochered = await fcOcheredKart(10);
  if (!ochered.length){ e.append(el("p","pusto","На сегодня карточек нет.")); return; }
  let index = 0, otkryta = false, znayuSchet = 0;
  const oblast = el("div","");
  e.append(oblast);
  function narisovat(){
    oblast.innerHTML = "";
    oblast.append(el("div","fc-schet", (index+1) + " из " + ochered.length));
    const karta = ochered[index];
    const kartaObl = el("div","fc-karta");
    kartaObl.append(el("div","",karta.en));
    if (otkryta) kartaObl.append(el("div","fc-perevod",karta.ru));
    kartaObl.onclick = () => { otkryta = !otkryta; narisovat(); };
    oblast.append(kartaObl);
    const knopki = el("div","stroka");
    const znayu = el("button","knopka","Знаю");
    const neZnayu = el("button","knopka tihaya","Не знаю");
    znayu.onclick = () => { fcOtvetit(karta, true); znayuSchet++; dalshe(); };
    neZnayu.onclick = () => { fcOtvetit(karta, false); dalshe(); };
    knopki.append(neZnayu, znayu);
    oblast.append(knopki);
  }
  function dalshe(){
    index++;
    otkryta = false;
    if (index >= ochered.length){
      oblast.innerHTML = "";
      oblast.append(el("div","blok").append(el("div","metka","Готово")) || el("div"));
      const itog = el("div","blok");
      itog.append(el("div","metka","Повторено"));
      itog.append(el("div","", "Карточек: " + ochered.length + ", отмечено знаю: " + znayuSchet));
      oblast.append(itog);
      return;
    }
    narisovat();
  }
  narisovat();
}

/* ---------- фокус-таймер 25 / 5 ---------- */
let fokusOstalos = 25*60*1000;
let fokusKonec = null;
let fokusRezhim = "rabota";
function fokusEkran(){
  ochistit();
  const e = ekran();
  e.append(el("div","zag-vk","Фокус 25 / 5"));
  e.append(el("p","podpis", fokusRezhim === "rabota" ? "Двадцать пять минут работы." : "Пять минут отдыха."));

  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","fokus-svg"); svg.setAttribute("width","220"); svg.setAttribute("height","220");
  svg.setAttribute("viewBox","0 0 220 220");
  const fon = document.createElementNS(svg.namespaceURI,"circle");
  fon.setAttribute("cx","110"); fon.setAttribute("cy","110"); fon.setAttribute("r","96");
  fon.setAttribute("fill","none"); fon.setAttribute("stroke","var(--setka)"); fon.setAttribute("stroke-width","10");
  const stlb = document.createElementNS(svg.namespaceURI,"circle");
  stlb.setAttribute("cx","110"); stlb.setAttribute("cy","110"); stlb.setAttribute("r","96");
  stlb.setAttribute("fill","none"); stlb.setAttribute("stroke","var(--chernila)"); stlb.setAttribute("stroke-width","10");
  stlb.setAttribute("stroke-linecap","round"); stlb.setAttribute("transform","rotate(-90 110 110)");
  svg.append(fon, stlb);
  const tekstVremya = document.createElementNS(svg.namespaceURI,"text");
  tekstVremya.setAttribute("x","110"); tekstVremya.setAttribute("y","118"); tekstVremya.setAttribute("text-anchor","middle");
  tekstVremya.setAttribute("class","fokus-vremya"); tekstVremya.setAttribute("fill","var(--chernila)");
  tekstVremya.setAttribute("font-size","30");
  svg.append(tekstVremya);
  e.append(svg);

  const polnayaDlina = 2 * Math.PI * 96;
  const dlinaRezhima = fokusRezhim === "rabota" ? 25*60*1000 : 5*60*1000;
  function otrisovat(){
    const ostalos = fokusKonec ? Math.max(0, fokusKonec - Date.now()) : fokusOstalos;
    const min = Math.floor(ostalos/60000), sek = Math.floor((ostalos%60000)/1000);
    tekstVremya.textContent = min + ":" + pad2(sek);
    const dolya = ostalos / dlinaRezhima;
    stlb.setAttribute("stroke-dasharray", (polnayaDlina*dolya) + " " + polnayaDlina);
    if (fokusKonec && ostalos <= 0){
      clearInterval(aktivnyInterval); aktivnyInterval = null;
      fokusKonec = null; fokusOstalos = 0;
      tryaska();
      narisovatKnopkiPosleFinisha();
    }
  }
  const knopki = el("div","stroka");
  const staryKnopka = el("button","knopka", fokusKonec ? "Пауза" : "Старт");
  const sbrosKnopka = el("button","knopka tihaya","Сброс");
  staryKnopka.onclick = () => {
    if (fokusKonec){
      fokusOstalos = fokusKonec - Date.now();
      fokusKonec = null;
      if (aktivnyInterval) { clearInterval(aktivnyInterval); aktivnyInterval = null; }
      staryKnopka.textContent = "Старт";
    } else {
      fokusKonec = Date.now() + fokusOstalos;
      staryKnopka.textContent = "Пауза";
      aktivnyInterval = setInterval(otrisovat, 500);
    }
  };
  sbrosKnopka.onclick = () => {
    if (aktivnyInterval) { clearInterval(aktivnyInterval); aktivnyInterval = null; }
    fokusRezhim = "rabota"; fokusKonec = null; fokusOstalos = 25*60*1000;
    otkrytEkranBezDobavleniya();
  };
  knopki.append(sbrosKnopka, staryKnopka);
  e.append(knopki);

  const posleFinisha = el("div","");
  e.append(posleFinisha);
  function narisovatKnopkiPosleFinisha(){
    posleFinisha.innerHTML = "";
    if (fokusRezhim === "rabota"){
      const kZakrasit = el("button","knopka");
      kZakrasit.style.marginTop = "12px";
      kZakrasit.textContent = "Закрасить клетку Учеба";
      kZakrasit.onclick = async () => { await izmenitKletku("learn", 1); kZakrasit.textContent = "Клетка закрашена"; kZakrasit.disabled = true; };
      posleFinisha.append(kZakrasit);
      const kPereryv = el("button","knopka tihaya");
      kPereryv.style.marginTop = "10px";
      kPereryv.textContent = "Начать перерыв 5 минут";
      kPereryv.onclick = () => { fokusRezhim = "pereryv"; fokusOstalos = 5*60*1000; fokusKonec = null; otkrytEkranBezDobavleniya(); };
      posleFinisha.append(kPereryv);
    } else {
      const kSnova = el("button","knopka");
      kSnova.style.marginTop = "12px";
      kSnova.textContent = "Новый круг 25 минут";
      kSnova.onclick = () => { fokusRezhim = "rabota"; fokusOstalos = 25*60*1000; fokusKonec = null; otkrytEkranBezDobavleniya(); };
      posleFinisha.append(kSnova);
    }
  }
  function otkrytEkranBezDobavleniya(){ stekEkranov[stekEkranov.length-1] = fokusEkran; fokusEkran(); }

  otrisovat();
  if (fokusKonec) aktivnyInterval = setInterval(otrisovat, 500);
}

/* ---------- вкладка Итоги ---------- */
async function itogiEkran(){
  ochistit();
  const e = ekran();
  e.append(el("div","zag-vk","Итоги"));

  const semDney = [];
  for (let i = 6; i >= 0; i--){
    const d = novayaData(-i);
    const dan = await poluchitMesyacKletok(klMonthKey(d));
    semDney.push({d, summa: summaDnya(dan, denNomer(d))});
  }
  const maxShkala = Math.max(NORMA_KLETOK, ...semDney.map(x => x.summa));
  const barBlok = el("div","liniya-blok");
  barBlok.append(el("div","metka","Клетки за 7 дней"));
  const bary = el("div","bary7");
  const normaLiniya = el("div","norma-liniya");
  normaLiniya.style.bottom = (NORMA_KLETOK/maxShkala*100) + "%";
  bary.append(normaLiniya);
  semDney.forEach(x => {
    const stolb = el("div","bar7-stolb");
    const zalivka = el("div","bar7-zalivka");
    zalivka.style.height = Math.max(2, x.summa/maxShkala*100) + "%";
    stolb.append(zalivka);
    stolb.append(el("div","bar7-podpis", NEDELYA_KOR[x.d.getDay()]));
    bary.append(stolb);
  });
  barBlok.append(bary);
  e.append(barBlok);

  const teploBlok = el("div","liniya-blok");
  teploBlok.append(el("div","metka","30 дней"));
  const teplokartaObl = el("div","teplokarta");
  for (let i = 29; i >= 0; i--){
    const d = novayaData(-i);
    const dan = await poluchitMesyacKletok(klMonthKey(d));
    const summa = summaDnya(dan, denNomer(d));
    const kv = el("i","");
    const pct = Math.min(100, summa * 20);
    kv.style.background = summa === 0 ? "var(--setka)" : "color-mix(in srgb, var(--chernila) " + pct + "%, var(--bumaga))";
    teplokartaObl.append(kv);
  }
  teploBlok.append(teplokartaObl);
  e.append(teploBlok);

  const kursyBlok = el("div","liniya-blok");
  kursyBlok.append(el("div","metka","Пройдено"));
  for (const kurs of KURSY){
    const spisok = kurs.id === "peregovory" ? await gruzhu("scenarii.json") : await gruzhu(kurs.fayl);
    const sdelano = kurs.id === "peregovory" ? (progress.peregovory || []).length : (progress[kurs.id] || []).length;
    kursyBlok.append(el("div","", kurs.nazvanie + ": " + sdelano + " из " + spisok.length));
  }
  e.append(kursyBlok);

  const serieBlok = el("div","liniya-blok");
  serieBlok.append(el("div","metka","Серии"));
  const {s1, s5} = await serii();
  serieBlok.append(el("div","", "Хотя бы одна клетка подряд: " + s1 + " дней"));
  serieBlok.append(el("div","", "Норма подряд: " + s5 + " дней"));
  e.append(serieBlok);

  const itogiBlok = el("div","liniya-blok");
  itogiBlok.append(el("div","metka","Последние итоги дня"));
  const zapisi = [];
  for (let i = 0; i < 3; i++){
    const d = novayaData(0); d.setMonth(d.getMonth() - i);
    const mk = dnMonthKey(d);
    const dan = await poluchitMesyacDnya(mk);
    Object.keys(dan).forEach(den => {
      const it = dan[den].itog || {};
      if (it.sdelal || it.sdvinul || it.zavtra){
        zapisi.push({data: new Date(d.getFullYear(), d.getMonth(), Number(den)), itog: it});
      }
    });
  }
  zapisi.sort((a,b) => b.data - a.data);
  if (!zapisi.length) itogiBlok.append(el("p","pusto","Пока нет ни одного итога дня."));
  zapisi.slice(0,5).forEach(z => {
    const karta = el("div","itog-karta");
    karta.append(el("div","m", z.data.getDate() + " " + MESYACY[z.data.getMonth()]));
    if (z.itog.sdelal) karta.append(el("div","", z.itog.sdelal));
    if (z.itog.sdvinul) karta.append(el("div","", z.itog.sdvinul));
    if (z.itog.zavtra) karta.append(el("div","", z.itog.zavtra));
    itogiBlok.append(karta);
  });
  e.append(itogiBlok);
}
