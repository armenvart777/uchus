<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Армен учится</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fon:#F2F4F3; --karta:#FFFFFF; --tekst:#1B2320; --vtoroy:#6B7671; --liniya:#E4E9E6; --dorozhka:#E6EBE8;
    --akcent:#2B6F5F; --na-akcente:#FFFFFF; --geroy-fon:#2B6F5F; --geroy-tekst:#FFFFFF;
    --zeleniy:#2E8A5F; --krasniy:#C2543E;
    --t-sin:#3B72C4; --t-zel:#2B8A74; --t-yan:#B97A1C; --t-roz:#C24E68; --t-fio:#7457C2; --t-ser:#5F6E7A;
    --ten:0 1px 2px rgba(22,34,29,.05);
    --font-text:"Golos Text",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fon:#0D1110; --karta:#171C1A; --tekst:#E7ECE9; --vtoroy:#8C9892; --liniya:#252C29; --dorozhka:#28302D;
      --akcent:#63BFA4; --na-akcente:#0B1512; --geroy-fon:#1C4439; --geroy-tekst:#E6F2ED;
      --zeleniy:#5BC08F; --krasniy:#E27A63;
      --t-sin:#7EA9EC; --t-zel:#5EC2A8; --t-yan:#E1AA52; --t-roz:#E6809A; --t-fio:#A68EEB; --t-ser:#9AA8B3;
      --ten:none;
    }
  }
  :root[data-theme="dark"]{
    --fon:#0D1110; --karta:#171C1A; --tekst:#E7ECE9; --vtoroy:#8C9892; --liniya:#252C29; --dorozhka:#28302D;
    --akcent:#63BFA4; --na-akcente:#0B1512; --geroy-fon:#1C4439; --geroy-tekst:#E6F2ED;
    --zeleniy:#5BC08F; --krasniy:#E27A63;
    --t-sin:#7EA9EC; --t-zel:#5EC2A8; --t-yan:#E1AA52; --t-roz:#E6809A; --t-fio:#A68EEB; --t-ser:#9AA8B3;
    --ten:none;
  }
  *{box-sizing:border-box}
  html,body{background:var(--fon)}
  body{margin:0;color:var(--tekst);font:16px/1.45 var(--font-text);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
  button{-webkit-tap-highlight-color:transparent;font-family:inherit}
  button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--akcent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

  .pole{max-width:480px;min-width:0;margin:0 auto;
    padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
  .nadzag{color:var(--vtoroy);font-size:13px;font-weight:500;margin:0 0 2px}
  .zag-vk{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
  h2{font-size:16px;line-height:1.3;margin:0;font-weight:600}
  .podpis{color:var(--vtoroy);font-size:14px;margin:0 0 16px}
  .metka{font-size:13px;color:var(--vtoroy);font-weight:600;margin:0 0 10px}
  .opis{color:var(--vtoroy);font-size:14px;margin-top:2px}
  .teoriya{white-space:pre-wrap}
  .pusto{color:var(--vtoroy);text-align:center;padding:22px 10px;margin:0;font-size:14px}
  .pochemu{font-size:14px;color:var(--vtoroy);margin-top:10px}
  .schetchik{font-size:12px;color:var(--vtoroy);text-align:right;margin-top:6px;font-variant-numeric:tabular-nums}

  .liniya-blok,.blok,.koltso-obl,.gruppa{background:var(--karta);border-radius:18px;box-shadow:var(--ten);
    padding:16px;margin:0 0 12px}
  .gruppa{padding:0 16px;overflow:hidden}
  .kartochki{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}

  .karta-kurs{display:block;width:100%;text-align:left;background:var(--karta);border:0;border-radius:18px;
    box-shadow:var(--ten);padding:15px 16px;color:inherit;font:inherit;cursor:pointer;transition:transform .12s}
  .karta-kurs:active{transform:scale(.985)}
  .gruppa .karta-kurs{border-radius:0;box-shadow:none;background:none;padding:14px 0;border-top:1px solid var(--liniya)}
  .gruppa .karta-kurs:first-child{border-top:0}
  .gruppa .karta-kurs:active{transform:none;opacity:.6}
  .ryad{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .znak{display:flex;align-items:center;color:var(--zeleniy);flex:0 0 auto}
  .polosa{height:6px;background:var(--dorozhka);border-radius:99px;margin-top:12px;overflow:hidden}
  .polosa i{display:block;height:100%;background:var(--akcent);border-radius:99px}
  .schet{font-variant-numeric:tabular-nums;color:var(--vtoroy);font-size:13px;margin-top:6px}

  .fraza{padding:10px 0;border-top:1px solid var(--liniya)}
  .metka + .fraza{border-top:0;padding-top:0}
  .fraza b{font-weight:600}
  .fraza .per{color:var(--vtoroy);font-size:14px;margin-top:2px}
  .fraza .kogda{color:var(--vtoroy);font-size:13px;margin-top:4px;font-style:italic}
  .shablon{padding:10px 0;border-top:1px solid var(--liniya);white-space:pre-wrap}
  .metka + .shablon{border-top:0;padding-top:0}
  .variant{display:block;width:100%;text-align:left;background:var(--fon);border:1.5px solid transparent;
    border-radius:14px;padding:12px 14px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer}
  .variant.verno{border-color:var(--zeleniy);background:color-mix(in srgb,var(--zeleniy) 12%,var(--karta))}
  .variant.neverno{border-color:var(--krasniy);background:color-mix(in srgb,var(--krasniy) 10%,var(--karta))}
  .kejs{white-space:pre-wrap;background:var(--fon);border-radius:16px 16px 16px 4px;padding:12px 14px}

  .knopka{background:var(--akcent);color:var(--na-akcente);border:0;border-radius:14px;min-height:50px;
    padding:13px 18px;font:inherit;font-weight:600;width:100%;cursor:pointer;transition:transform .12s,opacity .12s}
  .knopka:active{transform:scale(.98)}
  .knopka[disabled]{opacity:.35}
  .knopka.tihaya{background:color-mix(in srgb,var(--akcent) 12%,var(--karta));color:var(--akcent)}
  .knopka.malaya{width:auto;min-height:0;padding:9px 14px;border-radius:12px;font-size:14px}
  .stroka{display:flex;gap:10px;margin-top:12px}
  .stroka .knopka{flex:1}

  textarea,input[type=text],input[type=time]{width:100%;background:var(--karta);color:var(--tekst);
    border:1.5px solid var(--liniya);border-radius:14px;padding:12px 14px;font:inherit;resize:vertical;
    -webkit-appearance:none;appearance:none}
  .blok textarea,.liniya-blok textarea,.blok input[type=text],.blok input[type=time]{background:var(--fon);border-color:transparent}
  textarea:focus,input:focus{outline:none;border-color:var(--akcent)}
  textarea{min-height:110px}
  input[type=time]{width:auto;min-width:120px;min-height:44px}
  ::placeholder{color:var(--vtoroy);opacity:.8}

  .vkladki{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
    background:color-mix(in srgb,var(--karta) 88%,transparent);
    -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
    border-top:1px solid var(--liniya);padding-bottom:env(safe-area-inset-bottom)}
  .vk-btn{flex:1;max-width:96px;background:none;border:0;color:var(--vtoroy);font:500 11px var(--font-text);
    padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .vk-znak{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:99px;
    transition:background .15s}
  .vk-btn.aktivna{color:var(--akcent);font-weight:600}
  .vk-btn.aktivna .vk-znak{background:color-mix(in srgb,var(--akcent) 14%,transparent)}

  .plashka{background:color-mix(in srgb,var(--krasniy) 11%,var(--karta));color:var(--tekst);border-radius:14px;
    padding:12px 14px;margin-bottom:12px;font-size:14px}

  .geroy{background:var(--geroy-fon);color:var(--geroy-tekst);border-radius:22px;padding:18px;margin:14px 0 12px}
  .geroy-verh{display:flex;align-items:center;gap:16px}
  .geroy-tekst{flex:1;min-width:0}
  .geroy-metka{font-size:13px;opacity:.8;font-weight:500}
  .geroy-cifra{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px;
    font-variant-numeric:tabular-nums}
  .geroy-pod{font-size:14px;opacity:.85}
  .geroy svg circle:first-child{stroke:color-mix(in srgb,var(--geroy-tekst) 22%,transparent)!important}
  .geroy svg circle + circle{stroke:var(--geroy-tekst)!important}
  .bystro{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .bystro-knopka{display:flex;align-items:center;gap:8px;min-height:56px;padding:9px 10px 9px 12px;border:0;border-radius:14px;
    background:color-mix(in srgb,var(--geroy-tekst) 13%,transparent);color:inherit;font:inherit;text-align:left;cursor:pointer;
    transition:transform .1s,background .15s}
  .bystro-knopka:active{transform:scale(.97);background:color-mix(in srgb,var(--geroy-tekst) 22%,transparent)}
  .bystro-knopka.shirokaya{grid-column:1/-1}
  .bystro-tekst{flex:1;min-width:0;display:flex;flex-direction:column}
  .bystro-imya{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bystro-pod{font-size:12px;opacity:.8;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
  .bystro-pod .tochka-cveta{width:8px;height:8px;border-radius:3px;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--geroy-tekst) 70%,transparent)}
  .bystro-plyus{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:var(--geroy-tekst);color:var(--geroy-fon);font-size:18px;font-weight:600;line-height:1}

  .koltso-obl{display:flex;align-items:center;gap:16px}
  .koltso-cifra{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .koltso-podpis{color:var(--vtoroy);font-size:14px}
  .cifra{font-variant-numeric:tabular-nums;font-weight:700}

  .privychka-stroka{display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;border-top:1px solid var(--liniya);gap:10px}
  .privychka-stroka:first-child,.metka + .privychka-stroka{border-top:0}
  .metka-ryad + .privychka-stroka{border-top:0;padding-top:2px}
  .liniya-blok > .privychka-stroka:first-child{padding-top:0}
  .liniya-blok > .privychka-stroka:last-child{padding-bottom:0}
  .privychka-imya{display:flex;align-items:center;gap:12px;min-width:0}
  .tochka-cveta{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
  .privychka-chislo{font-variant-numeric:tabular-nums;font-weight:600;min-width:26px;text-align:center;font-size:17px}
  .shag{display:flex;align-items:center;gap:4px;margin:0;background:var(--fon);border-radius:99px;padding:3px;flex:0 0 auto}
  .krug-knopka{width:36px;height:36px;border-radius:50%;border:0;background:var(--karta);box-shadow:var(--ten);
    color:var(--tekst);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .1s}
  .krug-knopka:active{transform:scale(.9)}
  .shag .krug-knopka:last-child{background:var(--akcent);color:var(--na-akcente)}
  .shag.malyy .krug-knopka{width:30px;height:30px;font-size:17px}
  .shag.malyy .privychka-chislo{min-width:20px;font-size:15px}
  .metka-ryad{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
  .metka-ryad .metka{margin:0}
  .sohr{font-size:13px;color:var(--vtoroy);font-variant-numeric:tabular-nums;text-align:right}

  .plan-punkt{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--liniya);min-height:52px}
  .metka + .plan-punkt,.metka-ryad + .plan-punkt{border-top:0;padding-top:2px}
  .liniya-blok > .plan-punkt:last-child{padding-bottom:0}
  .galochka{position:relative;width:26px;height:26px;border-radius:50%;border:2px solid var(--liniya);
    background:none;flex:0 0 auto;color:var(--na-akcente);padding:0;
    display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  button.galochka{cursor:pointer}
  button.galochka::before{content:"";position:absolute;inset:-10px}
  .galochka.on{background:var(--akcent);border-color:var(--akcent)}
  .plan-tekst{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer}
  .plan-zag{display:block}
  .plan-detal{display:block;color:var(--vtoroy);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plan-hvost{color:var(--vtoroy);font-size:14px;font-variant-numeric:tabular-nums}
  .opasno{background:var(--krasniy)!important;color:var(--na-akcente)!important}

  .dnevnik-stroka{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
  .dnevnik-den{width:22px;color:var(--vtoroy);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .dnevnik-kletki{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-height:10px}
  .dnevnik-kletki i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .dnevnik-summa{width:18px;text-align:right;color:var(--vtoroy);font-variant-numeric:tabular-nums}
  .dnevnik-stroka.pustoy .dnevnik-den,.dnevnik-stroka.pustoy .dnevnik-summa{opacity:.5}

  #list-canvas{width:100%;max-width:260px;height:auto;display:block;margin:6px auto 0}
  .list-podpis{color:var(--vtoroy);font-size:13px;margin-top:10px}

  .teplokarta{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .teplokarta i{aspect-ratio:1;border-radius:5px;display:block;background:var(--dorozhka)}

  .bary7{display:flex;align-items:flex-end;gap:10px;height:130px;margin:6px 0 0;position:relative}
  .bar7-stolb{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
  .bar7-zalivka{width:100%;max-width:30px;background:var(--akcent);border-radius:7px;min-height:4px}
  .bar7-podpis{font-size:12px;color:var(--vtoroy)}
  .norma-liniya{position:absolute;left:0;right:0;border-top:1.5px dashed color-mix(in srgb,var(--vtoroy) 50%,transparent)}

  .palitra{display:flex;gap:12px;margin:10px 0}
  .cvet-obraz{width:36px;height:36px;border-radius:50%;border:3px solid var(--fon);box-shadow:0 0 0 2px transparent;cursor:pointer}
  .cvet-obraz.vybran{box-shadow:0 0 0 2px var(--akcent)}

  .fc-karta{background:var(--karta);box-shadow:var(--ten);border-radius:22px;padding:28px 18px;min-height:200px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:22px;
    font-weight:600;margin-bottom:6px;cursor:pointer}
  .fc-perevod{color:var(--vtoroy);font-size:16px;font-weight:400;margin-top:12px}
  .fc-schet{text-align:center;color:var(--vtoroy);font-size:13px;margin-bottom:10px;font-variant-numeric:tabular-nums}
  .fc-podskazka{text-align:center;color:var(--vtoroy);font-size:13px;margin-bottom:6px}

  .fokus-svg{display:block;margin:18px auto 10px;max-width:100%}
  .fokus-vremya{font-family:var(--font-text);font-weight:600;font-variant-numeric:tabular-nums}

  .itog-karta{border-top:1px solid var(--liniya);padding:10px 0;font-size:14px}
  .metka + .itog-karta{border-top:0;padding-top:0}
  .itog-karta .m{color:var(--vtoroy);font-size:12px;font-weight:600;margin-bottom:2px}
  .kurs-stroka{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--liniya);font-size:15px}
  .metka + .kurs-stroka{border-top:0;padding-top:0}
  .kurs-stroka span:last-child{color:var(--vtoroy);font-variant-numeric:tabular-nums;flex:0 0 auto}

  .razdel{font-size:13px;font-weight:600;color:var(--vtoroy);margin:18px 4px 8px}
  .oglav-stroka{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;
    background:none;border:0;border-top:1px solid var(--liniya);padding:9px 0;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .oglav-stroka:first-child{border-top:0}
  .oglav-stroka:active{opacity:.55}
  .oglav-ikonka{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    color:var(--ton,var(--akcent));background:color-mix(in srgb,var(--ton,var(--akcent)) 14%,var(--karta))}
  .oglav-imya{flex:1;min-width:0}
  .oglav-status{flex:0 0 auto;color:var(--vtoroy);font-size:14px;font-variant-numeric:tabular-nums}
  .oglav-strelka{display:flex;color:var(--vtoroy);opacity:.55;flex:0 0 auto;margin-left:-4px}
  .ton-sin{--ton:var(--t-sin)} .ton-zel{--ton:var(--t-zel)} .ton-yan{--ton:var(--t-yan)}
  .ton-roz{--ton:var(--t-roz)} .ton-fio{--ton:var(--t-fio)} .ton-ser{--ton:var(--t-ser)}

  .nap-chipy{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .nap-chip{background:var(--fon);border:0;border-radius:99px;padding:9px 14px;
    font:inherit;font-size:14px;color:inherit;cursor:pointer}
  .nap-chip.vybran{background:var(--akcent);color:var(--na-akcente);font-weight:500}
  .nap-vremya-blok{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0}
  .nap-podpis-malaya{color:var(--vtoroy);font-size:14px}
  .nap-zapis{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--liniya)}
  .metka + .nap-zapis{border-top:0;padding-top:0}
  .nap-zapis-levo{flex:1;min-width:0;overflow-wrap:anywhere}
  .nap-zapis-vremya{display:block;color:var(--akcent);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
  .upravlenie{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  [hidden]{display:none!important}
  .tost{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;max-width:448px;margin:0 auto;
    display:flex;align-items:center;gap:12px;background:var(--tekst);color:var(--fon);border-radius:14px;padding:12px 14px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:15px;opacity:0;visibility:hidden;transform:translateY(8px);
    transition:opacity .18s,transform .18s,visibility .18s}
  .tost.vidno{opacity:1;visibility:visible;transform:none}
  .tost-tekst{flex:1;min-width:0}
  .tost-knopka{background:none;border:0;padding:6px 4px;font:inherit;font-weight:700;flex:0 0 auto;cursor:pointer;
    color:color-mix(in srgb,var(--akcent) 45%,var(--fon))}
</style>
</head>
<body>
<div class="pole" id="ekran"></div>
<nav class="vkladki" id="vkladki"></nav>
<div class="tost" id="tost" role="status" aria-live="polite"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
try { if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast("7.7") && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e){}

/* ---------- тема ---------- */
function primenitTemu(){
  if (!tg) return;
  if (tg.colorScheme === "dark") document.documentElement.setAttribute("data-theme","dark");
  else if (tg.colorScheme === "light") document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");
}
function kraskiTelegrama(){
  try {
    if (!tg || !tg.isVersionAtLeast || !tg.isVersionAtLeast("6.1")) return;
    const fon = getComputedStyle(document.documentElement).getPropertyValue("--fon").trim();
    if (fon) { tg.setHeaderColor(fon); tg.setBackgroundColor(fon); }
  } catch(e){}
}
if (tg){
  primenitTemu();
  kraskiTelegrama();
  try { tg.onEvent && tg.onEvent("themeChanged", () => { primenitTemu(); kraskiTelegrama(); renderVkladku(); }); } catch(e){}
}
function temnayaTema(){
  const atr = document.documentElement.getAttribute("data-theme");
  if (atr === "dark") return true;
  if (atr === "light") return false;

function mestnoGlavnee(k){

function citatKlyuchi(klyuchi, gotovo){
  const h = hranilishe();
  let uzhe = false;
  const rezultat = {};
  const odinRaz = () => { if (!uzhe) { uzhe = true; gotovo(rezultat); } };
  const izLokalnogo = () => {
    klyuchi.forEach(k => { try { const v = localStorage.getItem(k); if (v != null) rezultat[k] = v; } catch(e){} });
  };
  if (!h || !h.getItems) { izLokalnogo(); odinRaz(); return; }
  setTimeout(() => { if (!uzhe) { izLokalnogo(); odinRaz(); } }, 2500);
  try {
    h.getItems(klyuchi, (osh, znach) => {
      if (!osh && znach) Object.assign(rezultat, znach);
      if (!Object.keys(rezultat).length) izLokalnogo();
      klyuchi.forEach(k => {
        if (!mestnoGlavnee(k)) return;
        try { const v = localStorage.getItem(k); if (v != null) rezultat[k] = v; } catch(e){}
      });
      odinRaz();
    });
  } catch(e) { izLokalnogo(); odinRaz(); }
}
function citatKlyuchiP(klyuchi){ return new Promise(res => citatKlyuchi(klyuchi, res)); }

function pishuKlyuch(klyuch, znachenie, gotovo){
  let lokalno = true, uzhe = false;
  try { localStorage.setItem(klyuch, znachenie); localStorage.setItem("mestno_" + klyuch, "1"); } catch(e){ lokalno = false; }
  const h = hranilishe();
  if (!h) { if (gotovo) gotovo(lokalno ? "telefon" : "oshibka"); return; }
  const itog = (oblako) => {
    if (uzhe) return;
    uzhe = true;
    if (oblako) { try { if (localStorage.getItem(klyuch) === znachenie) localStorage.removeItem("mestno_" + klyuch); } catch(e){} }
    if (gotovo) gotovo(oblako ? "ok" : (lokalno ? "telefon" : "oshibka"));
  };
  setTimeout(() => itog(false), 5000);
  try { h.setItem(klyuch, znachenie, (osh, ok) => itog(!osh && ok !== false)); } catch(e){ itog(false); }
}

function poluchitVseKlyuchi(gotovo){
  const h = hranilishe();

    try { h.getKeys((osh, spisok) => { gotovo(osh ? [] : (spisok || [])); }); return; } catch(e){}
  }
  try { gotovo(Object.keys(localStorage)); } catch(e){ gotovo([]); }
}

let fcKolodaCache = null;

async function fcOcheredKart(limit){
  const koloda = await fcKoloda();
  await fcZagrusit();
  const seg = denEpohiSeychas();
  const spisok = koloda.map((k,i) => {
    const zap = fcSost[i];
    const box = zap != null ? Math.floor(zap / 100000) : 0;
    const due = zap != null ? zap % 100000 : seg;
    return {i, en:k.en, ru:k.ru, box, due};
  });
  const gotovyye = spisok.filter(k => k.due <= seg).sort((a,b) => a.box - b.box);
  if (gotovyye.length >= limit) return gotovyye.slice(0, limit);
  const ostalnye = spisok.filter(k => k.due > seg);
  return gotovyye.concat(ostalnye.slice(0, limit - gotovyye.length));
}
function fcOtvetit(karta, znayu){
  const seg = denEpohiSeychas();
  const box = znayu ? Math.min(karta.box + 1, 4) : 0;
  const due = seg + LEITNER_DNI[box];
  fcSost[karta.i] = box * 100000 + due;
  fcSohranitOtlozheno();
}
async function fcSkolkoKSegodnya(){
  const koloda = await fcKoloda();
  if (!koloda.length) return null;
  await fcZagrusit();
  const seg = denEpohiSeychas();
  let n = 0;
  koloda.forEach((k, i) => {
    const due = fcSost[i] != null ? fcSost[i] % 100000 : seg;
    if (due <= seg) n++;
  });
  return n;
}

const NE_USHLO = "Бот не получил. Открой тетрадь кнопкой Открыть тетрадь под полем ввода в чате.";
function otpravitVChat(obj, esliNeUshlo){
  const stroka = JSON.stringify(obj);
  const neVyshlo = (tekst) => { tost(tekst, null, null, 7000); if (esliNeUshlo) esliNeUshlo(); };
  if (!tg || !tg.sendData) { neVyshlo("Это работает только внутри телеграма."); return false; }
  if (baytyStroki(stroka) > 4096) { neVyshlo("Слишком длинно для отправки, сократи текст."); return false; }
  try { sbrosOtlozhennyh(); tg.sendData(stroka); }
  catch(e){ neVyshlo(NE_USHLO); return false; }
  setTimeout(() => neVyshlo(NE_USHLO), 2500);
  return true;
}
function podtverzhdenie(knopka, vopros, deystvie){

    sbros();
    deystvie();
  };
}

/* ---------- напоминания ---------- */
function baytyStroki(s){
  try { return new TextEncoder().encode(s).length; } catch(e){ return s.length; }
}
async function napGruzim(){
  const rez = await citatKlyuchiP(["nap"]);
  let spisok = [];
  if (rez.nap) { try { spisok = JSON.parse(rez.nap); } catch(e){ spisok = []; } }
  return Array.isArray(spisok) ? spisok : [];
}
function napFormatVremya(kogdaSek){
  const d = new Date(kogdaSek * 1000);
  const seg = novayaData(0), zavtra = novayaData(1);
  const chch = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  const toZheDen = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if (toZheDen(d, seg)) return "сегодня " + chch;
  if (toZheDen(d, zavtra)) return "завтра " + chch;
  return pad2(d.getDate()) + "." + pad2(d.getMonth()+1) + " " + chch;
}
async function napSkoroBudushhaya(){
  const spisok = await napGruzim();
  const seg = Math.floor(Date.now()/1000);
  const budushhie = spisok.filter(z => z && z.k > seg).sort((a,b) => a.k - b.k);
  return budushhie.length ? budushhie[0] : null;
}
async function napDobavit(tekst, kogda){
  let spisok = await napGruzim();
  const seg = Math.floor(Date.now()/1000);
  spisok = spisok.filter(z => z && typeof z.k === "number" && z.k > seg - 86400);
  spisok.push({t: tekst, k: kogda});
  spisok.sort((a,b) => a.k - b.k);
  if (spisok.length > 20) spisok = spisok.slice(spisok.length - 20);
  let stroka = JSON.stringify(spisok);
  while (baytyStroki(stroka) > 4000 && spisok.length > 1){
    spisok.shift();
    stroka = JSON.stringify(spisok);
  }
  pishuKlyuch("nap", stroka);
  return spisok;
}
async function napUbratLokalno(tekst, kogda){
  const spisok = await napGruzim();
  const i = spisok.findIndex(z => z && z.t === tekst && z.k === kogda);
  if (i < 0) return;
  spisok.splice(i, 1);
  pishuKlyuch("nap", JSON.stringify(spisok));
}

  const varianty = [

  ];
  if (kChasu(0, 21) - 15*60 > seychasSek()) varianty.push(["Сегодня в 21:00", () => kChasu(0, 21)]);

  vremyaPole.oninput = () => {
    chipKnopki.forEach(c => c.classList.remove("vybran"));
    if (!vremyaPole.value){ kogdaSek = null; obnovit(); return; }
    const [chh, cmm] = vremyaPole.value.split(":").map(Number);
    let d = novayaData(0);
    d.setHours(chh, cmm, 0, 0);
    if (d.getTime() <= Date.now()) { d = novayaData(1); d.setHours(chh, cmm, 0, 0); }
    kogdaSek = Math.floor(d.getTime()/1000);

  };

  const knopka = el("button","knopka","Напомнить");
  const podskazka = el("div","pochemu");
  function obnovit(){

  }

  spisok.filter(z => z && z.k > seg2).sort((a,b) => a.k - b.k).forEach(z => {

        spisokBlok.insertBefore(stroka, pustoEl);
        proveritPusto();
      });
    });
    stroka.append(ubrat);
    spisokBlok.append(stroka);
  });
  spisokBlok.append(pustoEl);
  proveritPusto();
  e.append(spisokBlok);
  e.append(el("p","podpis","Тут то, что ставил из тетради. Все напоминания в чате: /napomni"));
}

/* ---------- вкладка Сегодня ---------- */
async function vcheraPusto(){
  const v = novayaData(-1);
  const dan = await poluchitMesyacKletok(klMonthKey(v));
  if (!Object.keys(dan).some(k => Number(k) < v.getDate() && summaDnya(dan, k) > 0)) return false;
  return summaDnya(dan, denNomer(v)) === 0;
}
async function sleduyushhiyUrok(){
  for (const kurs of KURSY){
    if (!kurs.fayl) continue;
    const uroki = await gruzhu(kurs.fayl);
    const proydennye = progress[kurs.id] || [];
    const urok = uroki.find(u => !proydennye.includes(u.id));
    if (urok) return {kurs, urok};
  }
  return null;
}
function sleduyushhiyKejs(kejsy){
  const proydeno = progress.peregovory || [];
  return kejsy.findIndex((k, i) => !proydeno.includes(String(i)));
}

function svgKoltso(znachenie, norma){
  const r = 34, l = 2 * Math.PI * r, dolya = Math.min(1, znachenie / norma);
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width","84"); svg.setAttribute("height","84"); svg.setAttribute("viewBox","0 0 84 84");
  const fon = document.createElementNS(svg.namespaceURI,"circle");
  fon.setAttribute("cx","42"); fon.setAttribute("cy","42"); fon.setAttribute("r",r);
  fon.setAttribute("fill","none"); fon.setAttribute("stroke","var(--dorozhka)"); fon.setAttribute("stroke-width","8");
  const perednyy = document.createElementNS(svg.namespaceURI,"circle");
  perednyy.setAttribute("cx","42"); perednyy.setAttribute("cy","42"); perednyy.setAttribute("r",r);
  perednyy.setAttribute("fill","none"); perednyy.setAttribute("stroke","var(--akcent)"); perednyy.setAttribute("stroke-width","8");
  if (dolya <= 0) perednyy.setAttribute("stroke-opacity","0");
  perednyy.setAttribute("stroke-linecap","round");
  perednyy.setAttribute("stroke-dasharray", (l*dolya) + " " + l);
  perednyy.setAttribute("transform","rotate(-90 42 42)");
  svg.append(fon, perednyy);
  return svg;
}

function narisovatList(canvas, vsegoZahodovChislo){
  const ctx = canvas.getContext("2d");
  const w = canvas.width / LIST_STOLBCOV, h = canvas.height / LIST_RYADOV;
  const zakrasheno = Math.floor(vsegoZahodovChislo / CENA_LISTA);
  const stil = getComputedStyle(document.documentElement);
  const akcent = stil.getPropertyValue("--akcent").trim() || "#2B6F5F";
  const dorozhka = stil.getPropertyValue("--dorozhka").trim() || "#E6EBE8";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let n = 0;
  for (let r = 0; r < LIST_RYADOV; r++){
    for (let c = 0; c < LIST_STOLBCOV; c++){
      ctx.fillStyle = n < zakrasheno ? akcent : dorozhka;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(c*w + 2, r*h + 2, w - 4, h - 4, 3);
      else ctx.rect(c*w + 2, r*h + 2, w - 4, h - 4);
      ctx.fill();
      n++;
    }
  }
}

function urokEkran(kurs, urok){
  ochistit();
  const e = ekran();
  e.append(el("div","zag-vk",urok.nazvanie));
  if (urok.zachem) e.append(el("p","podpis",urok.zachem));

  const teor = el("div","blok");
  teor.append(el("div","metka","Суть"));
  teor.append(el("div","teoriya",urok.teoriya || ""));
  e.append(teor);

  if (urok.frazy && urok.frazy.length){
    const blok = el("div","blok");
    blok.append(el("div","metka","Фразы"));
    urok.frazy.forEach(f => {
      const stroka = el("div","fraza");
      const en = el("div"); en.append(el("b","",f.en || ""));
      stroka.append(en);
      stroka.append(el("div","per", f.ru || ""));
      if (f.kogda) stroka.append(el("div","kogda", f.kogda));
      blok.append(stroka);
    });
    e.append(blok);
  }
  if (urok.shablony && urok.shablony.length){
    const blok = el("div","blok");
    blok.append(el("div","metka","Готовые реплики"));
    urok.shablony.forEach(s => blok.append(el("div","shablon", s)));
    e.append(blok);
  }

  const test = urok.test || [];
  let verno = 0, otvecheno = 0;
  test.forEach((vopros, nomer) => {
    const blok = el("div","blok");
    blok.append(el("div","metka","Вопрос " + (nomer+1)));
    blok.append(el("div","teoriya", vopros.vopros || ""));
    const otvet = el("div"); otvet.style.marginTop = "10px";
    (vopros.varianty || []).forEach((variant, i) => {
      const k = el("button","variant", variant);
      k.onclick = () => {
        if (blok.dataset.gotovo) return;
        blok.dataset.gotovo = "1";
        otvecheno++;
        const pravilniy = Number(vopros.verniy);
        if (i === pravilniy){ k.classList.add("verno"); verno++; tryaska(); }
        else {
          k.classList.add("neverno");
          const knopki = otvet.querySelectorAll(".variant");
          if (knopki[pravilniy]) knopki[pravilniy].classList.add("verno");
        }
        if (vopros.pochemu) blok.append(el("div","pochemu", vopros.pochemu));
        if (otvecheno === test.length) zakrytUrok(kurs, urok, verno, test.length);
      };
      otvet.append(k);
    });
    blok.append(otvet);
    e.append(blok);
  });
  if (!test.length) {
    const prochital = el("button","knopka","Прочитал, отметить урок");
    prochital.onclick = () => { tryaska(); prochital.remove(); zakrytUrok(kurs, urok, 0, 0); };
    e.append(prochital);
  }
}

async function zakrytUrok(kurs, urok, verno, vsego){
  const e = ekran();
  if (!progress[kurs.id]) progress[kurs.id] = [];
  if (!progress[kurs.id].includes(urok.id)) progress[kurs.id].push(urok.id);
  pishuProgress();
  const [, uroki, privychki] = await Promise.all([pravkaPlana("urok", true), gruzhu(kurs.fayl), poluchitPrivychki()]);
  if (!e.isConnected) return;
  const itog = el("div","blok");
  itog.append(el("div","metka","Урок пройден"));
  itog.append(el("div","", (vsego ? "Верных " + verno + " из " + vsego + ". " : "") + "В плане дня отмечено."));
  const proyd = progress[kurs.id];
  const i = uroki.findIndex(u => u.id === urok.id);
  let sled = null;
  for (let s = 1; s < uroki.length; s++){
    const u = uroki[(i + s + uroki.length) % uroki.length];
    if (!proyd.includes(u.id)) { sled = u; break; }
  }
  if (sled) {
    const k = el("button","knopka","Следующий урок: " + sled.nazvanie);
    k.style.marginTop = "12px";
    k.onclick = () => { tryaska(); zamenitEkran(() => urokEkran(kurs, sled)); };
    itog.append(k);
  } else itog.append(el("div","pochemu","Курс пройден целиком."));
  const learn = privychki.find(p => p.id === "learn");
  if (learn) {
    const kl = el("button","knopka tihaya","Закрасить клетку " + learn.name);
    kl.style.marginTop = "10px";
    kl.onclick = async () => {
      kl.disabled = true;
      const n = await izmenitKletku("learn", 1);
      kl.replaceWith(el("div","pochemu", learn.name + ": " + n + " за сегодня"));
    };
    itog.append(kl);
  }
  const kSpisku = el("button","knopka tihaya","К списку уроков");
  kSpisku.style.marginTop = "10px";
  kSpisku.onclick = () => { if (stekEkranov.length >= 2) nazadPoSteku(); else zamenitEkran(() => spisokUrokov(kurs)); };
  itog.append(kSpisku);
  e.append(itog);
  itog.scrollIntoView({behavior:"smooth", block:"end"});
}

function kejsEkran(kejs, nomer){
  ochistit();
  const e = ekran();
  e.append(el("div","zag-vk", kejs.kto || "Заказчик"));
  if (kejs.chego_hotel) e.append(el("p","podpis", "Чего он добивается: " + kejs.chego_hotel));

  const blok = el("div","blok");
  blok.append(el("div","metka","Сообщение заказчика"));
  blok.append(el("div","kejs", kejs.soobshenie || ""));
  e.append(blok);

  const gruz = {tip: "razbor", kejs: kejs.soobshenie || "", situaciya: kejs.chego_hotel || "", otvet: ""};
  const klyuchChern = "chern_" + nomer;
  const otvetBlok = el("div","blok");
  const metka = el("label","metka","Твой ответ");
  metka.htmlFor = "otvet_" + nomer;
  otvetBlok.append(metka);
  const pole = document.createElement("textarea");
  pole.id = "otvet_" + nomer;
  pole.maxLength = Math.max(300, Math.floor((4000 - baytyStroki(JSON.stringify(gruz))) / 2));
  pole.placeholder = "Напиши так, как отправил бы заказчику.";
  try { pole.value = localStorage.getItem(klyuchChern) || ""; } catch(err){}
  otvetBlok.append(pole);
  const schetchik = el("div","schetchik");
  otvetBlok.append(schetchik);
  const knopka = el("button","knopka","Отправить на разбор");
  knopka.style.marginTop = "12px";
  let chernTaymer = null;
  const sohranitChernovik = () => {
    clearTimeout(chernTaymer);
    try {
      if (pole.value.trim()) localStorage.setItem(klyuchChern, pole.value);
      else localStorage.removeItem(klyuchChern);
    } catch(err){}
  };
  const obnovit = () => {
    const n = pole.value.length;
    schetchik.textContent = n + " " + sklon(n, "знак", "знака", "знаков") + (n > 400 ? ", длинновато" : "") + (n ? ", черновик сохраняется" : "");
    knopka.disabled = pole.value.trim().length < 10;
  };
  pole.oninput = () => { obnovit(); clearTimeout(chernTaymer); chernTaymer = setTimeout(sohranitChernovik, 400); };
  pole.onblur = sohranitChernovik;
  obnovit();
  knopka.onclick = async () => {
    const otvet = pole.value.trim();
    if (otvet.length < 10) return;
    tryaska();
    knopka.disabled = true;
    if (!progress.peregovory) progress.peregovory = [];
    const bylProyden = progress.peregovory.includes(String(nomer));
    if (!bylProyden) progress.peregovory.push(String(nomer));
    pishuProgress();
    await pravkaPlana("kejs", true);
    clearTimeout(chernTaymer);
    try { localStorage.removeItem(klyuchChern); } catch(err){}
    otpravitVChat({...gruz, otvet}, () => {
      try { localStorage.setItem(klyuchChern, pole.value); } catch(err){}
      if (!bylProyden) {
        progress.peregovory = progress.peregovory.filter(x => x !== String(nomer));
        pishuProgress();
      }
      obnovit();
    });
  };
  otvetBlok.append(knopka);
  otvetBlok.append(el("div","pochemu","Тетрадь закроется, разбор придет в чат: что отдал, что удержал, как надо было."));
  e.append(otvetBlok);
}

    znayu.onclick = () => { fcOtvetit(karta, true); znayuSchet++; dalshe(); };
    neZnayu.onclick = () => { fcOtvetit(karta, false); dalshe(); };
    knopki.append(neZnayu, znayu);
    oblast.append(knopki);
  }

      const gotovo = el("button","knopka","Готово");
      gotovo.onclick = () => { if (stekEkranov.length) nazadPoSteku(); else renderVkladku(); };
      ryad.append(esche, gotovo);
      itog.append(ryad);
      oblast.append(itog);
      return;
    }
    narisovat();
  }
  narisovat();
}

/* ---------- фокус-таймер 25 / 5 ---------- */
const FOKUS_DLINA = {rabota: 25*60*1000, pereryv: 5*60*1000};
let fokus = {rezhim: "rabota", konec: null, ostalos: FOKUS_DLINA.rabota};
function fokusZagruzit(){
  try {
    const f = JSON.parse(localStorage.getItem("fokus") || "null");
    if (f && FOKUS_DLINA[f.rezhim]) {
      const ost = Number(f.ostalos);
      fokus = {
        rezhim: f.rezhim,
        konec: typeof f.konec === "number" ? f.konec : null,
        ostalos: Number.isFinite(ost) ? Math.max(0, Math.min(FOKUS_DLINA[f.rezhim], ost)) : FOKUS_DLINA[f.rezhim]
      };
    }
  } catch(err){}
  fokusProverit();
}
function fokusSohranit(){ try { localStorage.setItem("fokus", JSON.stringify(fokus)); } catch(err){} }
function fokusProverit(){
  if (fokus.konec && fokus.konec <= Date.now()) { fokus.konec = null; fokus.ostalos = 0; fokusSohranit(); }
}
function fokusOstalosMs(){ return fokus.konec ? Math.max(0, fokus.konec - Date.now()) : fokus.ostalos; }
function fokusStatus(){
  fokusProverit();
  const min = Math.ceil(fokusOstalosMs() / 60000);
  if (fokus.konec) return (fokus.rezhim === "rabota" ? "идет, " : "перерыв, ") + min + " мин";
  if (fokus.ostalos <= 0) return fokus.rezhim === "rabota" ? "круг закончен" : "перерыв закончен";
  if (fokus.ostalos < FOKUS_DLINA[fokus.rezhim]) return "на паузе";
  return "таймер";
}
function fokusZapustit(rezhim, srazu){
  fokus = {rezhim, konec: srazu ? Date.now() + FOKUS_DLINA[rezhim] : null, ostalos: FOKUS_DLINA[rezhim]};
  fokusSohranit();
}
function fokusEkran(){
  ochistit();
  fokusProverit();
  const e = ekran();
  e.append(el("div","zag-vk","Фокус 25 / 5"));
  const podpis = el("p","podpis");
  e.append(podpis);

  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","fokus-svg"); svg.setAttribute("width","220"); svg.setAttribute("height","220");
  svg.setAttribute("viewBox","0 0 220 220");
  const fon = document.createElementNS(svg.namespaceURI,"circle");
  fon.setAttribute("cx","110"); fon.setAttribute("cy","110"); fon.setAttribute("r","96");
  fon.setAttribute("fill","none"); fon.setAttribute("stroke","var(--dorozhka)"); fon.setAttribute("stroke-width","10");
  const stlb = document.createElementNS(svg.namespaceURI,"circle");
  stlb.setAttribute("cx","110"); stlb.setAttribute("cy","110"); stlb.setAttribute("r","96");
  stlb.setAttribute("fill","none"); stlb.setAttribute("stroke","var(--akcent)"); stlb.setAttribute("stroke-width","10");
  stlb.setAttribute("stroke-linecap","round"); stlb.setAttribute("transform","rotate(-90 110 110)");
  svg.append(fon, stlb);
  const tekstVremya = document.createElementNS(svg.namespaceURI,"text");
  tekstVremya.setAttribute("x","110"); tekstVremya.setAttribute("y","124"); tekstVremya.setAttribute("text-anchor","middle");
  tekstVremya.setAttribute("class","fokus-vremya"); tekstVremya.setAttribute("fill","var(--tekst)");
  tekstVremya.setAttribute("font-size","44");
  svg.append(tekstVremya);
  e.append(svg);

  const polnayaDlina = 2 * Math.PI * 96;
  const knopki = el("div","stroka");
  const startKnopka = el("button","knopka");
  const sbrosKnopka = el("button","knopka tihaya","Сброс");
  knopki.append(sbrosKnopka, startKnopka);
  e.append(knopki);
  const botKnopka = el("button","knopka tihaya","Старт, бот напишет в конце");
  botKnopka.style.marginTop = "10px";
  e.append(botKnopka);
  const posleFinisha = el("div","");
  e.append(posleFinisha);
  let finishNarisovan = false;

  function nadpisi(){
    const zakonchen = !fokus.konec && fokus.ostalos <= 0;
    podpis.textContent = fokus.rezhim === "rabota"
      ? "Двадцать пять минут работы, потом пять отдыха. Таймер идет, даже если закрыть тетрадь."
      : "Пять минут отдыха. Встань, пройдись, посмотри вдаль.";
    startKnopka.textContent = fokus.konec ? "Пауза" : (fokus.ostalos < FOKUS_DLINA[fokus.rezhim] ? "Продолжить" : "Старт");
    knopki.hidden = zakonchen;
    botKnopka.hidden = zakonchen || !!fokus.konec;
  }
  function narisovatFinish(){
    if (finishNarisovan) return;
    finishNarisovan = true;
    const blok = el("div","blok");
    const posleRaboty = fokus.rezhim === "rabota";
    blok.append(el("div","metka", posleRaboty ? "Круг закончен" : "Перерыв закончен"));
    if (posleRaboty) {
      const kZakrasit = el("button","knopka","Закрасить клетку Учеба");
      kZakrasit.onclick = async () => { kZakrasit.disabled = true; const n = await izmenitKletku("learn", 1); kZakrasit.textContent = "Учеба: " + n + " за сегодня"; };
      const kPereryv = el("button","knopka tihaya","Начать перерыв 5 минут");
      kPereryv.style.marginTop = "10px";
      kPereryv.onclick = () => { tryaska(); fokusZapustit("pereryv", true); zamenitEkran(fokusEkran); };
      blok.append(kZakrasit, kPereryv);
    }
    const kSnova = el("button", posleRaboty ? "knopka tihaya" : "knopka", "Новый круг 25 минут");
    kSnova.style.marginTop = "10px";
    kSnova.onclick = () => { tryaska(); fokusZapustit("rabota", true); zamenitEkran(fokusEkran); };
    blok.append(kSnova);
    posleFinisha.append(blok);
  }
  function otrisovat(){
    const ostalos = fokusOstalosMs();
    const min = Math.floor(ostalos/60000), sek = Math.floor((ostalos%60000)/1000);
    tekstVremya.textContent = min + ":" + pad2(sek);
    stlb.setAttribute("stroke-dasharray", (polnayaDlina * ostalos / FOKUS_DLINA[fokus.rezhim]) + " " + polnayaDlina);
    if (fokus.konec && ostalos <= 0) {
      if (aktivnyInterval) { clearInterval(aktivnyInterval); aktivnyInterval = null; }
      fokus.konec = null; fokus.ostalos = 0; fokusSohranit();
      tryaska();
    }
    if (!fokus.konec && fokus.ostalos <= 0) { nadpisi(); narisovatFinish(); }
  }
  function start(){
    if (fokus.konec) return;
    if (fokus.ostalos <= 0) fokus.ostalos = FOKUS_DLINA[fokus.rezhim];
    fokus.konec = Date.now() + fokus.ostalos;
    fokusSohranit();
    if (aktivnyInterval) clearInterval(aktivnyInterval);
    aktivnyInterval = setInterval(otrisovat, 500);
    nadpisi(); otrisovat();
  }
  function pauza(){
    if (!fokus.konec) return;
    fokus.ostalos = Math.max(0, fokus.konec - Date.now());
    fokus.konec = null;
    fokusSohranit();
    if (aktivnyInterval) { clearInterval(aktivnyInterval); aktivnyInterval = null; }
    nadpisi(); otrisovat();
  }
  startKnopka.onclick = () => { tryaska(); if (fokus.konec) pauza(); else start(); };
  sbrosKnopka.onclick = () => { fokusZapustit("rabota", false); zamenitEkran(fokusEkran); };
  botKnopka.onclick = async () => {
    tryaska();
    start();
    const kogda = Math.floor(fokus.konec / 1000);
    const tekst = fokus.rezhim === "rabota" ? "25 минут фокуса прошли. Отметь клетку Учеба в тетради." : "Перерыв кончился, можно новый круг.";
    await napDobavit(tekst, kogda);
    otpravitVChat({tip:"napomni", tekst, kogda}, () => napUbratLokalno(tekst, kogda));
  };

  otrisovat();
  nadpisi();
  if (fokus.konec) aktivnyInterval = setInterval(otrisovat, 500);
}

/* ---------- вкладка Итоги ---------- */
async function itogiEkran(){
  ochistit();
  const e = ekran();
  e.append(el("div","nadzag","Как идет"));
  e.append(el("div","zag-vk","Итоги"));

  const semDney = [];
  for (let i = 6; i >= 0; i--){
    const d = novayaData(-i);
    const dan = await poluchitMesyacKletok(klMonthKey(d));
    semDney.push({d, summa: summaDnya(dan, denNomer(d))});
  }
  const maxShkala = Math.max(NORMA_KLETOK, ...semDney.map(x => x.summa));
  const barBlok = el("div","liniya-blok");
  barBlok.append(el("div","metka","Клетки за 7 дней"));
  const bary = el("div","bary7");
  const normaLiniya = el("div","norma-liniya");
  normaLiniya.style.bottom = (NORMA_KLETOK/maxShkala*100) + "%";
  bary.append(normaLiniya);
  semDney.forEach(x => {
    const stolb = el("div","bar7-stolb");
    const zalivka = el("div","bar7-zalivka");
    zalivka.style.height = Math.max(2, x.summa/maxShkala*100) + "%";
    stolb.append(zalivka);
    stolb.append(el("div","bar7-podpis", NEDELYA_KOR[x.d.getDay()]));
    bary.append(stolb);
  });
  barBlok.append(bary);
  e.append(barBlok);

  const teploBlok = el("div","liniya-blok");
  teploBlok.append(el("div","metka","30 дней"));
  const teplokartaObl = el("div","teplokarta");
  for (let i = 29; i >= 0; i--){
    const d = novayaData(-i);
    const dan = await poluchitMesyacKletok(klMonthKey(d));
    const summa = summaDnya(dan, denNomer(d));
    const kv = el("i","");
    const pct = Math.min(100, summa * 20);
    kv.style.background = summa === 0 ? "var(--dorozhka)" : "color-mix(in srgb, var(--akcent) " + Math.max(30, pct) + "%, var(--dorozhka))";
    kv.title = d.getDate() + " " + MESYACY[d.getMonth()] + ": " + summa;
    teplokartaObl.append(kv);
  }
  teploBlok.append(teplokartaObl);
  e.append(teploBlok);

  const kursyBlok = el("div","liniya-blok");
  kursyBlok.append(el("div","metka","Пройдено"));
  for (const kurs of KURSY){
    const spisok = kurs.id === "peregovory" ? await gruzhu("scenarii.json") : await gruzhu(kurs.fayl);
    const sdelano = kurs.id === "peregovory" ? (progress.peregovory || []).length : (progress[kurs.id] || []).length;
    kursyBlok.append(strokaZnacheniya(kurs.nazvanie, sdelano + " из " + spisok.length));
  }
  e.append(kursyBlok);

  const serieBlok = el("div","liniya-blok");
  serieBlok.append(el("div","metka","Серии"));
  const {s1, s5} = await serii();
  serieBlok.append(strokaZnacheniya("Хотя бы одна клетка", s1 + " дн."));
  serieBlok.append(strokaZnacheniya("Норма каждый день", s5 + " дн."));
  e.append(serieBlok);

  const itogiBlok = el("div","liniya-blok");
  itogiBlok.append(el("div","metka","Последние итоги дня"));
  const zapisi = [];
  for (let i = 0; i < 3; i++){
    const d = novayaData(0); d.setMonth(d.getMonth() - i);
    const mk = dnMonthKey(d);
    const dan = await poluchitMesyacDnya(mk);
    Object.keys(dan).forEach(den => {
      const it = dan[den].itog || {};
      if (it.sdelal || it.sdvinul || it.zavtra){
        zapisi.push({data: new Date(d.getFullYear(), d.getMonth(), Number(den)), itog: it});
      }
    });
  }
  zapisi.sort((a,b) => b.data - a.data);
  if (!zapisi.length) itogiBlok.append(el("p","pusto","Пока нет ни одного итога дня."));
  zapisi.slice(0,5).forEach(z => {
    const karta = el("div","itog-karta");
    karta.append(el("div","m", z.data.getDate() + " " + MESYACY[z.data.getMonth()]));
    if (z.itog.sdelal) karta.append(el("div","", z.itog.sdelal));
    if (z.itog.sdvinul) karta.append(el("div","", z.itog.sdvinul));
    if (z.itog.zavtra) karta.append(el("div","", z.itog.zavtra));
    itogiBlok.append(karta);
  });
  e.append(itogiBlok);
}

fokusZagruzit();
chitayuProgress(renderVkladku);
</script>
